name: wiki-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run wiki lint (strict)
        run: python3 scripts/wiki_lint.py --strict

      - name: Run wiki gap detect (informational)
        run: python3 scripts/wiki_gap_detect.py || true
